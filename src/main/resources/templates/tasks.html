<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク一覧</title>
</head>
<body>

    <h1>タスク一覧</h1>
	
	<p th:if="${errorMessage}" th:text="${errorMessage}"></p>
	
	<form action="/tasks" method="post">
		
		<input type="text" name="title"	placeholder="タスク名を入力"	>
		
		<button type="submit">追加</button>
		
	</form>
	
	<ul>
	    <li th:each="task : ${tasks}">
			
			<!-- タイトル更新フォーム　-->
			<form action="/tasks/update" method="post">
							
			   <input type="hidden" name="id" th:value="${task.id}">
							   
			   <input type="text"
					  name="title"
					  th:value="${task.title}">
									  
		       <input type="hidden" name="completed" th:value="${task.completed}">
							   
			   <button type="submit">更新</button>
							   
			</form>
			
			
			<!--　完了チェックフォーム(チェックボックス) -->
			<form action="/tasks/update" method="post">
			
		       <input type="hidden" name="id" th:value="${task.id}">
			   
			   <input type="hidden" name="title" th:value="${task.title}">
			   
			   <input type="checkbox"
			          name="completed"
					  value="true"
					  th:checked="${task.completed}"
					  onchange="this.form.submit()">
					  
			   <input type="hidden" name="completed" value="false">
	  
					
			</form>  
	       
			
			<!-- 削除フォーム -->
			<form action="/tasks/delete" method="post">
				
				<input type="hidden" name="id" th:value="${task.id}">
				<button type="submit">削除</button>
				
			</form>
	    </li>
	</ul>

</body>
</html>
